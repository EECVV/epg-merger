name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'merge_epg.py'
      - 'requirements.txt'
      - 'sources.txt'
      - 'aliases.json'
      - 'tests/**'
      - '.github/workflows/update-epg.yml'

permissions:
  contents: read

concurrency:
  group: epg-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Merge XMLTV sources
        run: python merge_epg.py --namespace-channels --allow-partial
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages setup
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain required Pages setup
        if: steps.pages.outcome == 'failure'
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          echo "::error title=GitHub Pages setup required::Open ${REPOSITORY_URL}/settings/pages and select GitHub Actions under Build and deployment > Source, then rerun this workflow. Each repository needs its own Pages setup."
          echo "The build completed and the EPG files are retained in the github-pages artifact."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
